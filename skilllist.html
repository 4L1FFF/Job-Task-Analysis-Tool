<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Skill list — JA Tool</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- ПРАВИЛЬНЫЙ путь к стилям: файл лежит в data/css/ -->
  <link rel="stylesheet" href="css/ja-tool.css" />

  <!-- (опционально) XLSX для экспорта. Если уже подключаешь где-то глобально — можно убрать. -->
  <script src="xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    .wrap { max-width: 1200px; margin: 0 auto; padding: 12px 16px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <strong>Job Task Analysis Tool — Skill list</strong>
      <div class="nav" style="margin-left:auto;gap:8px">
        <button id="btnRefresh" class="primary">Refresh</button>
        <button id="btnDownload">Download (Excel)</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="panel">
      <div class="inline">
        <span id="meta" class="badge">—</span>
        <span id="note" class="muted"></span>
      </div>
    </div>

    <div class="table-wrap">
      <table id="tbl">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- ПРАВИЛЬНЫЙ путь к скрипту: файл лежит в data/js/ -->
  <script src="js/skilllist.js"></script>
</body>
</html>
